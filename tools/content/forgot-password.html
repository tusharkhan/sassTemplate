  <main id="main-content" class="bg-grid relative flex min-h-screen items-center overflow-hidden">
    <!-- Decorative glows -->
    <div class="bg-glow pointer-events-none absolute -top-32 left-1/2 h-[32rem] w-[48rem] -translate-x-1/2" aria-hidden="true"></div>

    <!-- ================================================================
         Password Reset Start
    ================================================================ -->
    <section class="relative w-full px-5 pb-16 pt-32 sm:px-8" aria-labelledby="page-heading">
      <div class="mx-auto w-full max-w-md">
        <div class="card p-8 shadow-glow-sm sm:p-10">
          <span class="icon-tile">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="10" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>

          <h1 id="page-heading" class="mt-6 text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Reset your password</h1>
          <p class="mt-3 text-sm leading-relaxed">Enter the email on your account and we will send a reset link. It stays valid for 30 minutes and can only be used once.</p>

          <form class="mt-8" action="#" method="post">
            <div>
              <label for="reset-email" class="block text-sm font-semibold text-slate-900 dark:text-white">Email address</label>
              <input type="email" id="reset-email" name="email" required autocomplete="email" placeholder="you@company.com" class="mt-2 w-full rounded-xl border border-slate-400 bg-white px-4 py-3 text-sm text-slate-900 placeholder:text-slate-500 focus:border-primary-500 dark:border-slate-600 dark:bg-slate-900 dark:text-white dark:placeholder:text-slate-400">
            </div>
            <button type="submit" class="btn-primary mt-6 w-full py-3.5 text-base">Send reset link</button>
          </form>

          <p class="mt-8 border-t border-slate-200 pt-6 text-center text-sm dark:border-slate-800">
            Remembered it? <a href="login.html" class="font-semibold text-primary-600 transition-colors hover:text-primary-500 dark:text-primary-400">Back to sign in</a>
          </p>
        </div>

        <p class="mt-6 text-center text-xs leading-relaxed text-slate-500 dark:text-slate-400">
          Locked out of the email itself? <a href="contact.html" class="font-semibold text-primary-600 transition-colors hover:text-primary-500 dark:text-primary-400">Contact support</a> and we will verify you another way.
        </p>
      </div>
    </section>
    <!-- Password Reset End -->

  </main>
