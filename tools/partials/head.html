<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__</title>
  <meta name="description" content="__DESC__">
  <meta name="author" content="WaveNode">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="__TITLE__">
  <meta property="og:description" content="__OGDESC__">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <meta name="theme-color" content="#030712">

  <!-- Styles (self-hosted fonts + compiled Tailwind CSS) -->
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Theme bootstrap: applies the saved theme before first paint to avoid a flash -->
  <script>
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('wavenode-theme') === 'light') {
        document.documentElement.classList.remove('dark');
      }
    } catch (err) { /* localStorage unavailable — keep default dark theme */ }
  </script>
</head>
